name: "Terraform IAC"
on:
  push:
    branches:
      - main
      - stage
    paths:
      - 'terraform/**'

  pull_request:
    branches:
      - main
      - stage
    paths:
      - 'terraform/**'

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  BUCKET_TF_STATE: ${{ secrets.BUCKET_TF_STATE }}
  AWS_REGION: us-east-2
  EKS_CLUSTER: gitopsEKS

jobs:
    terraform:
        name: "Terraform IAC"
        runs-on: ubuntu-latest
        defaults:
            run:
                shell: bash
                working-directory: ./terraform

        steps:
            - name: "Checkout code"
              uses: actions/checkout@v3
            
            - name: "Setup Terraform"
              uses: hashicorp/setup-terraform@v2

            - name: "Terraform Init"
              id: init
              run: terraform init -backend-config="bucket=${{ env.BUCKET_TF_STATE }}"
            
            - name: Terraform Format
              id: fmt
              run: terraform fmt -check
            
            - name: "Terraform Validate"
              id: validate
              run: terraform validate
            
            - name: "Terraform Plan"
              id: plan
              run: terraform plan -no-color -input=false -out planfile
              continue-on-error: true

            - name: Terraform Plan Status
              if: steps.plan.outcome == 'failure'
              run: exit 1

            - name: "Terraform Apply"
              id: apple
              if: github.ref == 'refs/heads/main' && github.event_name == 'push'
              run: terraform apply -auto-approve -input=false planfile parallelism=1

            - name: Configure AWS Credentials
              uses: aws-actions/configure-aws-credentials@v1
              with:
                aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                aws-region: ${{ env.AWS_REGION }}
            - name: Get Kube config
              id: get_kubeconfig
              if: steps.apple.outcome == 'success'
              run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}

            - name: Install Ingress Controller
              id: install_ingress
              if: steps.apple.outcome == 'success' && steps.get_kubeconfig.outcome == 'success'
              run: kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.7.0/deploy/static/provider/aws/deploy.yaml --validate=false